<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lappupa.gif</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    /* Экран загрузки */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      color: #fff;
      font-size: 24px;
      text-align: center;
      padding: 20px;
      transition: opacity 0.8s;
    }
    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }
    /* Полноэкранная гифка */
    #gifScreen {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: #000;
      z-index: 20;
    }
    #gifScreen.show {
      display: flex;
    }
    #gifScreen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div id="loader">
    пока просто, готовы начать представление
  </div>

  <div id="gifScreen">
    <img src="Lappupa.gif" alt="Lappupa.gif">
  </div>

  <script>
    // Через 3 секунды скрываем загрузку и показываем гифку
    setTimeout(() => {
      document.getElementById('loader').classList.add('hide');
      document.getElementById('gifScreen').classList.add('show');
    }, 3000);
  </script>

</body>
</html>
